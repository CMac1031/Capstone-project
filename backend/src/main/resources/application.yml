spring:
  application:
    name: northstar-crm

  datasource:
    url: jdbc:postgresql://localhost:5432/northstar_crm
    username: northstar
    password: northstar
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: crm-interactions
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.northstar.crm.messaging"
        spring.json.value.default.type: com.northstar.crm.messaging.CustomerInteractionRecordedV1
        spring.json.use.type.headers: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}